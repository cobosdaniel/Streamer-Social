services:
  mysql:
    image: mysql:8.0
    container_name: streamer-social-local-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: localdev
      MYSQL_DATABASE: streamer_social
      MYSQL_USER: streamer_social
      MYSQL_PASSWORD: localdev
    ports:
      # Mapped to 3307 (not the default 3306) so this doesn't collide with a
      # MySQL you might already have running locally.
      - "3307:3306"
    volumes:
      - streamer_social_mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocaldev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  streamer_social_mysql_data:
